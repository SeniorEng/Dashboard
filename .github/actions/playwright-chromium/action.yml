name: Playwright-Chromium bereitstellen
description: >-
  Stellt Chromium fuer Playwright bereit — gecacht, ohne apt, mit Wiederholung
  und lautem Fehlschlag. EINE Formulierung fuer beide Aufrufstellen
  (tests-shard und e2e-smoke).

# ── Warum es diese Action gibt ───────────────────────────────────────────────
# `npx playwright install --with-deps chromium` war der Flake, der am 19.08.2026
# `main` (Lauf 32230089329), #111 und #113 rot gemacht hat. In JEDEM
# abgebrochenen Job stand derselbe Waisenprozess im Cleanup:
#
#   Terminate orphan process: pid (3267) (npm exec playwright install --with-deps chromium)
#
# `tests-shard (1)` bei #111 hatte 777 Log-Zeilen und hat mit dem Testen NIE
# angefangen — der Schritt hing 25 Minuten und frass das komplette Job-Budget
# (`timeout-minutes: 25`). Der `tests`-Job meldete danach nur die Folge
# ("Mindestens ein tests-shard-Leg ist nicht erfolgreich (cancelled)"), was wie
# ein Testfehler aussieht und keiner war.
#
# Drei Ursachen, alle drei hier behoben:
#
#  1. `tests-shard` hatte GAR KEINEN Browser-Cache und lud Chromium bei jedem
#     Lauf, dreimal parallel. Groesste Angriffsflaeche, ungeschuetzt.
#  2. `e2e-smoke` hatte einen Cache, aber mit Key auf `hashFiles('package-lock.json')`.
#     Jede beliebige Dependency-Aenderung entwertete ihn — deshalb traf es
#     ausgerechnet #113, das `package-lock.json` anfasste. Der Key haengt jetzt
#     an der `playwright-core`-Version, also an dem, was den Browser wirklich
#     bestimmt.
#  3. `--with-deps` fuhr bei JEDEM Lauf `apt-get`, Cache-Hit hin oder her. Der
#     Cache konnte den Haenger also gar nicht verhindern. Gestrichen: die
#     GitHub-Runner-Images bringen Chromiums Systembibliotheken mit.
#
# Fuer Fall 3 gilt bewusst „laut statt still": statt `--with-deps` prophylaktisch
# mitlaufen zu lassen, wird der Browser nach der Installation EINMAL gestartet.
# Scheitert das, ziehen wir `playwright install-deps` gezielt nach und starten
# erneut. Bleibt es rot, faellt der Job mit einer Meldung, die sagt was fehlt —
# statt dass ein fehlendes .so spaeter als kryptischer PDF-Fehler auftaucht.
#
# `timeout-minutes` gibt es auf Composite-Steps NICHT (nur auf Job-Steps). Die
# aeussere Schranke setzen deshalb die Aufrufer; die innere steckt hier als
# `timeout` je Versuch, damit ein Haenger nach 90 s abbricht und der naechste
# Versuch ueberhaupt zum Zug kommt. Obergrenze by construction: 3x90 s + 15 s
# Backoff = 285 s, also unter den 5 Minuten der Aufrufer.

runs:
  using: composite
  steps:
    - name: Playwright-Version aus dem Lockfile lesen
      id: pw
      shell: bash
      run: |
        VERSION="$(node -e "process.stdout.write(require('./package-lock.json').packages['node_modules/playwright-core'].version)")"
        if [ -z "$VERSION" ]; then
          echo "::error::playwright-core nicht in package-lock.json gefunden — Cache-Key waere leer."
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "playwright-core: $VERSION"

    - name: Chromium-Cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

    - name: Chromium installieren (ohne apt, mit Wiederholung)
      shell: bash
      run: |
        set -uo pipefail
        for versuch in 1 2 3; do
          if timeout 90 npx playwright install chromium; then
            echo "Chromium bereit (Versuch $versuch, Cache-Hit: ${{ steps.cache.outputs.cache-hit || 'false' }})."
            exit 0
          fi
          echo "::warning::playwright install chromium fehlgeschlagen oder haengt (Versuch $versuch/3)"
          sleep $((versuch * 5))
        done
        echo "::error::playwright install chromium nach 3 Versuchen nicht erfolgreich."
        exit 1

    - name: Startfaehigkeit pruefen, Systempakete nur bei Bedarf
      shell: bash
      run: |
        set -uo pipefail
        # WICHTIG: ausdruecklich `executablePath()` starten, nicht nur
        # `chromium.launch()`. Letzteres nimmt die headless-shell-Binary —
        # `tests-shard` setzt seinen CHROMIUM_PATH aber genau auf
        # `chromium.executablePath()`, also die VOLLE Chromium-Binary, mit der
        # spaeter die PDFs gerendert werden. Ohne diesen Zusatz pruefte die
        # Startfaehigkeit eine andere Datei als die, die im Ernstfall laeuft.
        starte() {
          node -e "
            const { chromium } = require('playwright-core');
            const pfad = chromium.executablePath();
            console.log('pruefe', pfad);
            chromium.launch({ executablePath: pfad }).then(b => b.close()).then(
              () => process.exit(0),
              e => { console.error(String(e && e.message || e)); process.exit(1); },
            );
          "
        }
        if starte; then
          echo "Chromium startet."
          exit 0
        fi
        # Genau hier waere `--with-deps` frueher blind gelaufen. Wir ziehen die
        # Systempakete gezielt nach und sagen im Log, dass es noetig war — wenn
        # das Runner-Image seine Bibliotheken verliert, wollen wir es SEHEN.
        echo "::warning::Chromium startet nicht — ziehe Systempakete gezielt nach (playwright install-deps)."
        if ! timeout 300 npx playwright install-deps chromium; then
          echo "::error::playwright install-deps chromium fehlgeschlagen."
          exit 1
        fi
        if starte; then
          echo "::warning::Chromium startet erst nach install-deps. Das Runner-Image bringt die Bibliotheken nicht mehr mit — Action pruefen."
          exit 0
        fi
        echo "::error::Chromium startet auch nach install-deps nicht."
        exit 1
